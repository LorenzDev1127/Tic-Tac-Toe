<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .game {
      width: min(92vw, 430px);
      padding: 24px;
      text-align: center;
      background: #000;
      border: 1px solid #fff;
      border-radius: 0;
      box-shadow: none;
    }

    h1 { margin: 0 0 20px; font-size: 2rem; }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-bottom: 20px;
    }

    .player-score {
      padding: 10px;
      border: 1px solid #fff;
      font-weight: bold;
    }

    .red, .blue { color: #fff; }

    #status {
      min-height: 24px;
      margin: 0 0 16px;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-right: 1px solid #fff;
      border-bottom: 1px solid #fff;
      border-radius: 0;
      background: #000;
      color: #fff;
      cursor: pointer;
      font-size: clamp(2rem, 12vw, 4rem);
      font-weight: bold;
      transition: background 0.15s;
    }

    .cell:hover:empty { background: #111; }
    .cell.x, .cell.o { color: #fff; }
    .cell.winner { background: #111; }

    .buttons { display: flex; gap: 8px; margin-top: 20px; }

    .buttons button {
      flex: 1;
      padding: 11px 8px;
      border: 1px solid #fff;
      border-radius: 0;
      background: #000;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .buttons button:hover { background: #fff; color: #000; }

    .cdn-lab { margin-top: 24px; padding-top: 20px; border-top: 1px solid #fff; text-align: left; font-size: 13px; line-height: 1.7; word-break: break-word; }
    .cdn-lab h2 { margin: 0 0 10px; font-size: 1.2rem; text-align: center; }
    .cdn-lab img { display: block; width: 100%; margin-bottom: 12px; border: 1px solid #fff; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>

    <div class="scoreboard" aria-label="Scoreboard">
      <div class="player-score red">Player 1 (X): <span id="scoreX">0</span></div>
      <div class="player-score blue">Player 2 (O): <span id="scoreO">0</span></div>
    </div>

    <p id="status">Player 1's turn (X)</p>

    <section class="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" aria-label="Top left"></button>
      <button class="cell" aria-label="Top middle"></button>
      <button class="cell" aria-label="Top right"></button>
      <button class="cell" aria-label="Middle left"></button>
      <button class="cell" aria-label="Center"></button>
      <button class="cell" aria-label="Middle right"></button>
      <button class="cell" aria-label="Bottom left"></button>
      <button class="cell" aria-label="Bottom middle"></button>
      <button class="cell" aria-label="Bottom right"></button>
    </section>

    <div class="buttons">
      <button id="newRound">New Round</button>
      <button id="resetScores">Reset Scores</button>
    </div>
    <section class="cdn-lab">
      <h2>Hello CDN!</h2>
      <img src="banner.svg" alt="Tic-tac-toe banner">
      <div><b>Student Name:</b> Florenz A. Valdez</div>
      <div><b>Student ID:</b> [2400682]</div>
      <div><b>Page Loaded (UTC):</b> <span id="cdn-ts"></span></div>
      <div><b>Your Browser:</b> <span id="cdn-ua"></span></div>
      <div><b>Viewport Size:</b> <span id="cdn-vp"></span></div>
    </section>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.getElementById('status');
    const scoreX = document.getElementById('scoreX');
    const scoreO = document.getElementById('scoreO');
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let currentPlayer = 'X';
    let gameActive = true;
    let scores = { X: 0, O: 0 };

    function updateStatus(message) {
      status.textContent = message || `Player ${currentPlayer === 'X' ? 1 : 2}'s turn (${currentPlayer})`;
      status.className = currentPlayer === 'X' ? 'red' : 'blue';
    }

    function checkResult() {
      for (const line of winningLines) {
        const [a, b, c] = line;
        if (cells[a].textContent && cells[a].textContent === cells[b].textContent && cells[a].textContent === cells[c].textContent) {
          line.forEach(index => cells[index].classList.add('winner'));
          gameActive = false;
          scores[currentPlayer]++;
          scoreX.textContent = scores.X;
          scoreO.textContent = scores.O;
          updateStatus(`Player ${currentPlayer === 'X' ? 1 : 2} wins!`);
          return;
        }
      }

      if (cells.every(cell => cell.textContent)) {
        gameActive = false;
        status.textContent = "It's a draw!";
        status.className = '';
      }
    }

    function play(event) {
      const cell = event.currentTarget;
      if (!gameActive || cell.textContent) return;

      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer === 'X' ? 'x' : 'o');
      checkResult();

      if (gameActive) {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }

    function newRound() {
      currentPlayer = 'X';
      gameActive = true;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
      updateStatus();
    }

    document.getElementById('newRound').addEventListener('click', newRound);
    document.getElementById('resetScores').addEventListener('click', () => {
      scores = { X: 0, O: 0 };
      scoreX.textContent = 0;
      scoreO.textContent = 0;
      newRound();
    });
    cells.forEach(cell => cell.addEventListener('click', play));
    updateStatus();

    document.getElementById('cdn-ts').textContent = new Date().toISOString();
    document.getElementById('cdn-ua').textContent = navigator.userAgent;
    const vp = () => document.getElementById('cdn-vp').textContent = window.innerWidth + ' x ' + window.innerHeight + ' px';
    vp(); window.addEventListener('resize', vp);
  </script>
</body>
</html>
